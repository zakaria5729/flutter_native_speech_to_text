name: flutter_native_speech_to_text
description: A Flutter plugin for native speech-to-text using Android's RecognizerIntent ACTION_RECOGNIZE_SPEECH and the browser's Web Speech API on web.
version: 1.1.0
homepage: https://github.com/zakaria5729/flutter_native_speech_to_text
repository: https://github.com/zakaria5729/flutter_native_speech_to_text
issue_tracker: https://github.com/zakaria5729/flutter_native_speech_to_text/issues

topics:
  - speech-to-text
  - voice
  - recognizer-intent
  - speech
  - android
  - web

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.zakaria5729.flutter_native_speech_to_text
        pluginClass: FlutterNativeSpeechToTextPlugin
      ios:
        pluginClass: FlutterNativeSpeechToTextPlugin
      web:
        pluginClass: FlutterNativeSpeechToTextWeb
        fileName: flutter_native_speech_to_text_web.dart
