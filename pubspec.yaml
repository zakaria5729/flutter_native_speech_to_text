name: flutter_native_speech_to_text
description: A Flutter plugin for native speech-to-text using Android's RecognizerIntent, Apple's Speech framework on iOS and macOS, and the Web Speech API on web. Windows and Linux fail safely.
version: 1.2.0
homepage: https://github.com/zakaria5729/flutter_native_speech_to_text
repository: https://github.com/zakaria5729/flutter_native_speech_to_text
issue_tracker: https://github.com/zakaria5729/flutter_native_speech_to_text/issues

topics:
  - speech-to-text
  - android
  - ios
  - web
  - desktop

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.zakaria5729.flutter_native_speech_to_text
        pluginClass: FlutterNativeSpeechToTextPlugin
      ios:
        pluginClass: FlutterNativeSpeechToTextPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: FlutterNativeSpeechToTextPlugin
        sharedDarwinSource: true
      windows:
        pluginClass: FlutterNativeSpeechToTextPluginCApi
      linux:
        pluginClass: FlutterNativeSpeechToTextPlugin
      web:
        pluginClass: FlutterNativeSpeechToTextWeb
        fileName: flutter_native_speech_to_text_web.dart
